name: onebox

services:
  redis:
    image: redis:8.10.2-alpine
    # BullMQ requires noeviction so queued jobs are never silently dropped.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['9200:9200']
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs localhost:9200/_cluster/health?wait_for_status=yellow']
      interval: 10s
      retries: 20

  greenmail:
    image: greenmail/standalone:2.1.14
    profiles: [mail]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled -Dgreenmail.verbose
    ports: ['3025:3025', '3143:3143', '3993:3993']

  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: [vector]
    ports: ['6333:6333']
    volumes: [qdrant-data:/qdrant/storage]

volumes:
  redis-data:
  es-data:
  qdrant-data:
