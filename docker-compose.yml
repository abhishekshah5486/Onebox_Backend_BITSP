name: onebox

services:
  redis:
    image: redis:8.10.2-alpine
    # BullMQ requires noeviction so queued jobs are never silently dropped.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['127.0.0.1:9200:9200']
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs localhost:9200/_cluster/health?wait_for_status=yellow']
      interval: 10s
      retries: 20

  # S3-compatible object store for attachment contents (SeaweedFS; MinIO is no longer published).
  objects:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${BLOB_ACCESS_KEY:?set BLOB_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${BLOB_SECRET_KEY:?set BLOB_SECRET_KEY in .env}
    ports: ['127.0.0.1:8333:8333']
    volumes: [objects-data:/data]

  greenmail:
    image: greenmail/standalone:2.1.14
    profiles: [mail]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled -Dgreenmail.verbose
    ports: ['127.0.0.1:3025:3025', '127.0.0.1:3143:3143', '127.0.0.1:3993:3993']

  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: [vector]
    ports: ['127.0.0.1:6333:6333']
    volumes: [qdrant-data:/qdrant/storage]

volumes:
  objects-data:
  redis-data:
  es-data:
  qdrant-data:
