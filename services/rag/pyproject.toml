[project]
name = "onebox-rag"
version = "0.0.0"
description = "OneBox RAG service: ingests mail, attachments and documents; retrieves grounded passages."
requires-python = "==3.13.*"
dependencies = [
  "boto3==1.43.126",
  "bullmq==3.5.0",
  "certifi==2026.10.23",
  "charset-normalizer==3.5.2",
  "cryptography==50.0.2",
  "defusedxml==0.7.1",
  "fastapi==0.162.1",
  "httpx==0.28.1",
  "markdown-it-py==4.2.0",
  "pdfplumber==0.11.10",
  "msoffcrypto-tool==6.1.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "pymongo==4.19.0",
  "puremagic==2.2.0",
  "pypdf==7.0.0",
  "pypdfium2==5.15.1",
  "python-multipart==0.0.33",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "selectolax==1.0.2",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]==1.43.126",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "reportlab==5.1.0",
  "ruff==0.17.4",
  "testcontainers==4.15.0",
  "types-defusedxml==0.7.0.20260504",
  "types-pyyaml==6.0.12.20261103",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onebox_rag"]

[tool.uv]
# Every package, transitive ones too, must be at least two weeks old when resolved.
exclude-newer = "2026-11-09T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (Testcontainers)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "bullmq.*", "msoffcrypto.*", "pdfplumber.*", "reportlab.*", "pypdfium2.*"]
ignore_missing_imports = true
