# Streams each signed-in user's live events (new mail, changes) to their open apps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
spec:
  replicas: 2
  selector:
    matchLabels: { app: realtime }
  template:
    metadata:
      labels: { app: realtime }
    spec:
      # Service env vars (e.g. AUTH_PORT=tcp://...) would collide with app config.
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: realtime
          image: onebox/realtime:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4010 }]
          env:
            - { name: REDIS_URL, value: 'redis://redis:6379' }
            - { name: AUTH_SERVICE_URL, value: 'http://auth:4001' }
          readinessProbe:
            httpGet: { path: /health/ready, port: 4010 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 4010 }
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
spec:
  selector: { app: realtime }
  ports: [{ port: 4010 }]
