apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      # Service env vars (e.g. AUTH_PORT=tcp://...) would collide with app config.
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: auth
          image: onebox/auth:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4001 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: onebox-secrets, key: DATABASE_URL } }
            - name: CREDENTIALS_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: onebox-secrets, key: CREDENTIALS_ENCRYPTION_KEY } }
          # Startup covers the remote database connect + migrations.
          startupProbe:
            httpGet: { path: /health/live, port: 4001 }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /health/ready, port: 4001 }
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 4001 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector: { app: auth }
  ports: [{ port: 4001 }]
