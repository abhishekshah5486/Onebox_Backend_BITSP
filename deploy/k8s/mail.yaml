apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
spec:
  replicas: 2
  selector:
    matchLabels: { app: mail }
  template:
    metadata:
      labels: { app: mail }
    spec:
      # Service env vars (e.g. AUTH_PORT=tcp://...) would collide with app config.
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: mail
          image: onebox/mail:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4003 }]
          env:
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: onebox-secrets, key: MONGO_URI } }
            - { name: REDIS_URL, value: 'redis://redis:6379' }
            - { name: AUTH_SERVICE_URL, value: 'http://auth:4001' }
          # Startup covers the remote database connect + migrations.
          startupProbe:
            httpGet: { path: /health/live, port: 4003 }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /health/ready, port: 4003 }
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 4003 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: mail
spec:
  selector: { app: mail }
  ports: [{ port: 4003 }]
