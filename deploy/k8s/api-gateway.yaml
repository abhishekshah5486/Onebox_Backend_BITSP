apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      # Service env vars (e.g. AUTH_PORT=tcp://...) would collide with app config.
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: api-gateway
          image: onebox/api-gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          env:
            - { name: REDIS_URL, value: 'redis://redis:6379' }
            - { name: AUTH_SERVICE_URL, value: 'http://auth:4001' }
            - { name: ACCOUNTS_SERVICE_URL, value: 'http://accounts:4002' }
            - { name: SETTINGS_SERVICE_URL, value: 'http://settings:4004' }
            - { name: LLM_PROXY_SERVICE_URL, value: 'http://llm-proxy:4006' }
            - { name: AI_SERVICE_URL, value: 'http://ai:4007' }
            - { name: PAYMENTS_SERVICE_URL, value: 'http://payments:4008' }
            - { name: MAIL_SERVICE_URL, value: 'http://mail:4003' }
          readinessProbe:
            httpGet: { path: /health/ready, port: 4000 }
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 4000 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  ports: [{ port: 4000 }]
